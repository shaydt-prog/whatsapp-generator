      // Build the QR onto a canvas. `scale` lets us render a hi-res version for Pro downloads.
      const buildQRCanvas = (scale) => {
        const qr = qrcode(0, isPro ? 'H' : 'L'); // higher error correction when a logo may be present
        qr.addData(whatsappLink);
        qr.make();

        const cellSize = 6 * scale;
        const margin = 2;
        const qrSize = qr.getModuleCount();
        const size = qrSize * cellSize + margin * 2 * cellSize;

        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size, size);

        ctx.fillStyle = isPro ? darkColor : '#0d4a2e';
        for (let row = 0; row < qrSize; row++) {
          for (let col = 0; col < qrSize; col++) {

      };

      const generateQRCode = () => {
        try {
          const src = buildQRCanvas(1);
          const canvas = canvasRef.current;
          canvas.width = src.width;
          canvas.height = src.height;
          canvas.getContext('2d').drawImage(src, 0, 0);
        } catch (error) {
          console.error('QR Error:', error);
        }
      };

      const copyToClipboard = async () => {
        if (!whatsappLink) return;
        try {
          await navigator.clipboard.writeText(whatsappLink);
        } catch (error) {
          const textArea = document.createElement('textarea');
          textArea.value = whatsappLink;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        }
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      // FREE for everyone: standard-resolution PNG download.
      const downloadPNG = () => {
        const canvas = buildQRCanvas(isPro ? 4 : 1); // Pro gets a large, print-ready file
        const link = document.createElement('a');
        link.download = 'whatsapp-qr-code.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };

      // Pro only: vector SVG that scales to any print size.
      const downloadSVG = () => {
        const qr = qrcode(0, 'H');
        qr.addData(whatsappLink);
        qr.make();
        const count = qr.getModuleCount();
        const margin = 2;
        const dim = count + margin * 2;
        let rects = '';
        for (let row = 0; row < count; row++) {
          for (let col = 0; col < count; col++) {
            if (qr.isDark(row, col)) {
              rects += `<rect x="${col + margin}" y="${row + margin}" width="1" height="1"/>`;
            }
          }
        }
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" shape-rendering="crispEdges"><rect width="${dim}" height="${dim}" fill="#ffffff"/><g fill="${darkColor}">${rects}</g></svg>`;
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = 'whatsapp-qr-code.svg';
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => setLogoImage(img);
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const renderPayPalButton = () => {
        const containerId = 'paypal-button-container-pro';
        const el = document.getElementById(containerId);
        if (!el || el.hasChildNodes()) return;
        if (typeof paypal === 'undefined') return;
        paypal.Buttons({
          createOrder: (data, actions) => actions.order.create({
            purchase_units: [{ amount: { value: '9.99', currency_code: 'USD' }, description: 'WhatsApp QR Generator - Pro (logo, colors, SVG, hi-res)' }]
          }),
          onApprove: async (data, actions) => {
            const order = await actions.order.capture();
            localStorage.setItem('userPlan', 'pro');
            localStorage.setItem('paymentId', order.id);
            setIsPro(true);
            setShowModal(false);
            alert('✅ Thank you! Pro features are now unlocked on this device.');
          },
          onError: (err) => {
            console.error('Payment error:', err);
            alert('❌ Payment could not be completed. You have not been charged. Please try again or email support@whatsappqr.com.');
          }
        }).render('#' + containerId);
      };

      return (
        <div className="container">
          <div className="main-wrapper">
            <header className="header">
              <div className="header-icon"><MessageSquare /></div>
              <h1>WhatsApp Link &amp; QR Code Generator</h1>
              <p className="header-subtitle">Create a click-to-chat link and download a QR code — free, no sign-up.</p>
              <div className="trust-badges">
                <div className="badge">✓ Free download</div>
                <div className="badge">✓ No registration</div>
                <div className="badge">✓ Works instantly</div>
              </div>
            </header>

            <section className="demo-section">
              <h2 className="demo-title">See How It Works</h2>
              <p className="demo-subtitle">How businesses use WhatsApp QR codes to get more customer messages</p>
              <img src="whatsappqr-stick.gif" alt="Demo of a WhatsApp QR code being scanned" className="demo-video" loading="lazy" />
              <p className="demo-note">💼 Business cards • 🏪 Store fronts • 📄 Marketing materials</p>
            </section>

            <div className="grid">
              {/* Input Panel */}
              <div className="glass-card">
                <div className="form-group">
                  <label className="label"><Phone /> Phone Number</label>
                  <div className="input-row">
                    <select value={countryCode} onChange={(e) => setCountryCode(e.target.value)} className="select-field">
                      {COUNTRY_CODES.map((item) => (
                        <option key={item.code} value={item.code}>{item.flag} {item.code}</option>
                      ))}
                    </select>
                    <input type="tel" value={phoneNumber} onChange={(e) => setPhoneNumber(e.target.value)} placeholder="501234567" className="input-field" />
                  </div>
                  <p className="hint">Enter your number without the country code.</p>
                </div>

                <div className="form-group">
                  <label className="label"><MessageSquare /> Pre-filled Message (Optional)</label>
                  <textarea value={message} onChange={(e) => setMessage(e.target.value)} placeholder="Hello! I'd like to chat with you..." rows={4} className="textarea-field" />
                  <p className="hint">This message appears pre-typed when someone opens the chat.</p>
                </div>

                {isPro && (
                  <div className="form-group">
                    <label className="label"><Upload /> Company Logo (Pro)</label>
                    <input ref={logoInputRef} type="file" accept="image/*" onChange={handleLogoUpload} className="input-field" />
                    <p className="hint">Upload a logo to place in the center of your QR code.</p>
                  </div>
                )}

                {whatsappLink && (
                  <div className="link-section">
                    <label className="label">Your WhatsApp Link (free)</label>
                    <div className="link-display-box"><p className="link-text mono">{whatsappLink}</p></div>
                    <button onClick={copyToClipboard} className="btn btn-free">
                      {copied && <span className="success-ping"></span>}
                      <Copy /> {copied ? 'Copied!' : 'Copy Link'}
                    </button>
                  </div>
                )}
              </div>

              {/* QR Preview Panel */}
              <div className="glass-card qr-panel">
                {whatsappLink ? (
                  <div className="qr-container">
                    <div className="qr-box"><canvas ref={canvasRef}></canvas></div>
                    <div className="qr-badge"><p className="qr-badge-text">Scan to Chat</p></div>

                    <button onClick={downloadPNG} className="btn btn-free" style={{ marginTop: '1rem' }}>
                      <Download /> {isPro ? 'Download PNG (hi-res)' : 'Download PNG (free)'}
                    </button>

                    {isPro ? (
                      <>
                        <button onClick={downloadSVG} className="btn btn-pro" style={{ marginTop: '0.5rem' }}>
                          <Download /> Download Vector (SVG)
                        </button>
                        <div className="pro-controls">
                          <label className="label">QR color</label>
                          <div className="color-row">
                            <input type="color" value={darkColor} onChange={(e) => setDarkColor(e.target.value)} />
                            <span className="hint" style={{ marginTop: 0 }}>Pick any brand color</span>
                          </div>
                        </div>
                      </>
                    ) : (
                      <button onClick={() => setShowModal(true)} className="btn btn-pro" style={{ marginTop: '0.5rem' }}>
                        <Upload /> Add logo, colors &amp; SVG — Pro $9.99
                      </button>
                    )}
                  </div>
                ) : (
                  <div className="empty-state">
                    <div className="empty-icon"><MessageSquare /></div>
                    <p style={{ fontWeight: 600, color: '#374151' }}>QR Code Preview</p>
                    <p style={{ fontSize: '0.875rem', color: '#6b7280' }}>Enter a phone number to generate</p>
                  </div>
                )}
              </div>
            </div>

            {/* Pricing */}
            <section className="pricing-section" style={{ marginTop: '3rem' }}>
              <div className="pricing-cards">
                <div className="pricing-card popular">
                  <div className="popular-badge">Free</div>
                  <div className="plan-name">Free</div>
                  <div className="plan-price">$0</div>
                  <p className="plan-description">Everything most people need</p>
                  <ul className="plan-features">
                    <li>Unlimited WhatsApp links</li>
                    <li>Live QR code preview</li>
                    <li>Copy link to clipboard</li>
                    <li>Download QR as PNG</li>
                  </ul>
                  <button className="btn btn-outline" disabled>Included</button>
                </div>

                <div className="pricing-card">
                  <div className="plan-name">Pro</div>
                  <div className="plan-price">$9.99 <small>one-time</small></div>
                  <p className="plan-description">For branding &amp; professional print</p>
                  <ul className="plan-features">
                    <li>Everything in Free</li>
                    <li>Add your logo to the QR</li>
                    <li>Custom brand colors</li>
                    <li>Vector SVG download (any size)</li>
                    <li>High-resolution PNG for print</li>
                  </ul>
                  <button className="btn btn-pro" onClick={() => setShowModal(true)}>Upgrade to Pro</button>
                </div>
              </div>
            </section>

            <section className="promo-section">
              <h2 className="promo-title">Print Your QR Code on Business Cards</h2>
              <p className="promo-subtitle">See how professional QR codes look on real business materials</p>
              <img src="whatsappqr-image.png" alt="QR code on business cards and marketing materials" className="promo-image" loading="lazy" />
              <p className="demo-note" style={{ marginTop: '1.5rem' }}>✨ High-resolution • 🖨️ Print-ready • 💼 Professional quality</p>
            </section>

            {/* Pro upgrade modal (transparent — the QR is already visible and downloadable for free) */}
            {showModal && (
              <div className="modal active" onClick={() => setShowModal(false)}>
                <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                  <button className="modal-close" onClick={() => setShowModal(false)}>×</button>
                  <div className="modal-header">
                    <h3 className="modal-title">Upgrade to Pro</h3>
                    <p className="modal-subtitle">One-time payment, no subscription. The free PNG download stays free.</p>
                  </div>
                  <div className="price-display">
                    <div className="price-amount">$9.99</div>
                    <p className="price-label">One-time payment</p>
                  </div>
                  <ul className="feature-list">
                    <li><Check style={{ width: 20, height: 20, color: '#7c3aed' }} /> Add your company logo to the QR</li>
                    <li><Check style={{ width: 20, height: 20, color: '#7c3aed' }} /> Custom brand colors</li>
                    <li><Check style={{ width: 20, height: 20, color: '#7c3aed' }} /> Vector SVG download (scales to any size)</li>
                    <li><Check style={{ width: 20, height: 20, color: '#7c3aed' }} /> High-resolution PNG for large-format print</li>
                  </ul>
                  <div id="paypal-button-container-pro" style={{ minHeight: '50px' }}></div>
                  <p className="hint" style={{ textAlign: 'center', marginTop: '1rem' }}>
                    Secure payment via PayPal. See our <a href="/refund.html" style={{ color: '#7c3aed' }}>refund policy</a>.
                  </p>
                </div>
              </div>
            )}

            {/* SEO Content */}
            <footer className="seo-footer">
              <div className="seo-content">
                <h2>Free WhatsApp Link &amp; QR Code Generator</h2>
                <p>
                  This free tool helps businesses and individuals create click-to-chat links (also called <strong>wa.me</strong> links) and
                  download QR codes for WhatsApp. Everything is generated in your browser — no account, no upload of your data to a server.
                </p>

                <h3>What is a WhatsApp click-to-chat link?</h3>
                <p>
                  WhatsApp lets anyone start a conversation with you through a simple link without saving your number first. This tool builds that
                  link from your phone number and an optional pre-filled message, then creates a scannable QR code you can print on:
                </p>
                <ul>
                  <li>Business cards and flyers</li>
                  <li>Social profiles and websites</li>
                  <li>Shop fronts, menus and packaging</li>
                  <li>Events and networking materials</li>
                </ul>

                <h3>What's free and what's Pro?</h3>
                <p>
                  Generating links, previewing the QR code, copying the link and downloading a standard PNG are <strong>free forever</strong>.
                  The optional one-time <strong>Pro</strong> upgrade ($9.99) adds genuine extras for branding and print: a logo in the center of the
                  QR, custom colors, a vector <strong>SVG</strong> file that scales to any size, and a high-resolution PNG for large-format printing.
                </p>

                <h3>Is this the official WhatsApp website?</h3>
                <p>
                  No. This is an independent tool and is not affiliated with, endorsed by, or sponsored by WhatsApp or Meta Platforms, Inc.
                  &ldquo;WhatsApp&rdquo; is a trademark of Meta Platforms, Inc., used here only to describe what the tool does.
                </p>
              </div>
            </footer>

            {/* Site footer with real contact + legal links */}
            <div className="site-footer">
              <div className="footer-links">
                <a href="/privacy.html">Privacy Policy</a>
                <a href="/terms.html">Terms of Service</a>
                <a href="/refund.html">Refund Policy</a>
                <a href="mailto:support@whatsappqr.com">Contact</a>
              </div>
              <p className="footer-disclaimer">
                whatsappqr.com is an independent service and is not affiliated with, endorsed by, or sponsored by WhatsApp LLC or
                Meta Platforms, Inc. &ldquo;WhatsApp&rdquo; and the WhatsApp logo are trademarks of Meta Platforms, Inc.
                Questions or refund requests: <a href="mailto:support@whatsappqr.com">support@whatsappqr.com</a>.
              </p>
              <p className="footer-disclaimer" style={{ marginTop: '0.75rem' }}>© {new Date().getFullYear()} whatsappqr.com. All rights reserved.</p>
            </div>
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    ReactDOM.createRoot(container).render(<WhatsAppLinkGenerator />);
  </script>
</body>
</html>
